<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11193b"/>
      <stop offset="55%" stop-color="#060b1e"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d82d9" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#c89dc1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7d82d9" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="beamLeft" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#7d82d9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7d82d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRight" x1="0.8" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c89dc1" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#c89dc1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ticketFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffdec6"/>
      <stop offset="55%" stop-color="#ffcead"/>
      <stop offset="100%" stop-color="#eb8b54"/>
    </linearGradient>
    <linearGradient id="stubFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d82d9"/>
      <stop offset="100%" stop-color="#5c62b8"/>
    </linearGradient>
  </defs>

  <!-- Base rounded card -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bg)"/>

  <!-- Stage spotlight beams (kept safely inside the rounded card bounds) -->
  <polygon points="56,12 104,12 184,244 92,244" fill="url(#beamLeft)"/>
  <polygon points="200,12 152,12 72,244 164,244" fill="url(#beamRight)"/>
  <ellipse cx="128" cy="212" rx="86" ry="22" fill="#7d82d9" fill-opacity="0.12"/>

  <!-- Card border -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="none" stroke="url(#rim)" stroke-width="3.5"/>

  <!-- Tilted concert ticket -->
  <g transform="rotate(-10 128 128)">
    <!-- Drop shadow -->
    <path d="M 54 78
             H 206
             A 12 12 0 0 1 218 90
             V 118
             A 14 14 0 0 0 218 146
             V 178
             A 12 12 0 0 1 206 190
             H 54
             A 12 12 0 0 1 42 178
             V 146
             A 14 14 0 0 0 42 118
             V 90
             A 12 12 0 0 1 54 78 Z"
          fill="#02040c" fill-opacity="0.55"/>

    <!-- Main ticket body (left section up to x=160) -->
    <path d="M 52 72
             H 160
             V 184
             H 52
             A 12 12 0 0 1 40 172
             V 142
             A 14 14 0 0 0 40 114
             V 84
             A 12 12 0 0 1 52 72 Z"
          fill="url(#ticketFill)"/>

    <!-- Ticket stub (right section from x=160) -->
    <path d="M 160 72
             H 204
             A 12 12 0 0 1 216 84
             V 114
             A 14 14 0 0 0 216 142
             V 172
             A 12 12 0 0 1 204 184
             H 160
             Z"
          fill="url(#stubFill)"/>

    <!-- Ticket outer highlight border -->
    <path d="M 52 72
             H 204
             A 12 12 0 0 1 216 84
             V 114
             A 14 14 0 0 0 216 142
             V 172
             A 12 12 0 0 1 204 184
             H 52
             A 12 12 0 0 1 40 172
             V 142
             A 14 14 0 0 0 40 114
             V 84
             A 12 12 0 0 1 52 72 Z"
          fill="none" stroke="#ffefe3" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Perforated tear line between main ticket and stub -->
    <line x1="160" y1="78" x2="160" y2="178"
          stroke="#060b1e" stroke-opacity="0.5" stroke-width="3"
          stroke-dasharray="5 6" stroke-linecap="round"/>

    <!-- Beamed eighth-note inside main ticket -->
    <g fill="#060b1e" stroke="#060b1e" stroke-linecap="round" stroke-linejoin="round">
      <line x1="90" y1="142" x2="90" y2="100" stroke-width="7"/>
      <line x1="126" y1="135" x2="126" y2="93" stroke-width="7"/>
      <polygon points="86.5,97 129.5,90 129.5,100 86.5,107" stroke="none"/>
      <polygon points="86.5,112 129.5,105 129.5,112 86.5,119" stroke="none"/>
      <ellipse cx="81" cy="144" rx="12" ry="9" transform="rotate(-18 81 144)" stroke="none"/>
      <ellipse cx="117" cy="137" rx="12" ry="9" transform="rotate(-18 117 137)" stroke="none"/>
    </g>

    <!-- Log / setlist lines on the stub -->
    <g stroke="#ffefe3" stroke-linecap="round" stroke-width="4.5" stroke-opacity="0.92">
      <line x1="173" y1="103" x2="192" y2="103"/>
      <line x1="173" y1="118" x2="195" y2="118" stroke-opacity="0.68"/>
      <line x1="173" y1="133" x2="188" y2="133" stroke-opacity="0.68"/>
      <line x1="173" y1="148" x2="194" y2="148" stroke-opacity="0.48"/>
    </g>
  </g>

  <!-- Accent stage-light sparkles -->
  <circle cx="52" cy="52" r="4" fill="#ffcead" fill-opacity="0.85"/>
  <circle cx="206" cy="48" r="3" fill="#c89dc1" fill-opacity="0.85"/>
  <circle cx="196" cy="204" r="3.5" fill="#7d82d9" fill-opacity="0.75"/>
</svg>
